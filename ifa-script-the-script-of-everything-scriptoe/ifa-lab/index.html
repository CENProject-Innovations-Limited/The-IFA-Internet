/* ── Login Gate Component ─────────────────────────────────────── */
function LoginGate({ onAuth }) {
  const [user, setUser] = useState('');
  const [pass, setPass] = useState('');
  const [err, setErr] = useState('');

  function handleSubmit(e) {
    e.preventDefault();
    if (user.trim() === CREDENTIALS.user && pass === CREDENTIALS.pass) {
      sessionStorage.setItem(SESSION_KEY, '1');
      onAuth();
    } else {
      setErr('Incorrect username or password. Please try again.');
    }
  }

  return (
    <div className="login-gate">
      <div className="login-card">
        <span className="login-card__icon">⊙</span>
        <div className="login-card__title">IfaLab · OrisaLab</div>
        <div className="login-card__sub">
          IfaScript Lab &amp; OrisaScript Lab · Dual Symbol Laboratory<br/>
          Sign in to access the lab
        </div>
        <form onSubmit={handleSubmit}>
          <label className="login-card__label">Username</label>
          <input
            className="login-card__input"
            type="text"
            value={user}
            onChange={e => { setUser(e.target.value); setErr(''); }}
            placeholder="IfaLab"
            autoComplete="username"
            autoFocus
          />
          <label className="login-card__label">Password</label>
          <input
            className="login-card__input"
            type="password"
            value={pass}
            onChange={e => { setPass(e.target.value); setErr(''); }}
            placeholder="••••••••••••"
            autoComplete="current-password"
          />
          <button className="login-card__btn" type="submit">Enter IfaLab →</button>
          <div className="login-card__error">{err}</div>
        </form>
        <div className="login-card__hint">
          <strong>Access:</strong> This is a restricted lab environment.<br/>
          Contact the IfaScript team for credentials.
        </div>
      </div>
    </div>
  );
}
